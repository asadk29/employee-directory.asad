<!DOCTYPE html>
<html lang="en" xmlns:th="http://www/thymeleaf.org">
 <head>
   <meta charset="UTF-8">
   <title>Employee Directory</title>
   
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
 </head>
 <body>
 
    <div class="container">
      <h1 class="mt-3">Employee Directory</h1>
      <hr>
      
      <a th:href="@{/employees/showFormToAdd}" class="btn btn-primary btn-lg mb-3">Add Employee</a>
      <br><br>
      <a th:href="@{/employees/sortByFirstName}" class="btn btn-secondary btn-sm mb-2">Sort By First Name</a>
      
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="tempEmp : ${employees}">
            <td th:text="${tempEmp.firstName}"></td>
            <td th:text="${tempEmp.lastName}"></td>
            <td th:text="${tempEmp.email}"></td>
            <td>
             <a th:href="@{/employees/showFormForUpdate(employeeId=${tempEmp.id})}" class="btn btn-info btn-sm">Update</a>
             <a th:href="@{/employees/delete(employeeId=${tempEmp.id})}" class="btn btn-danger btn-sm" onClick="if(!(confirm('Are You sure you want to delete this employee?')))return false">Delete</a>
            </td>
      </table>
   </div>

 </body>
</html>
